name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: core
            context: apps/core
            build-args: ""
          - service: ui
            context: apps/ui
            build-args: "NEXT_PUBLIC_API_URL=http://localhost:8080"
          - service: hydra-cli
            context: apps/cli
            build-args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/hydradns/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.build-args }}
            ${{ matrix.service == 'hydra-cli' && format('VERSION={0}', steps.meta.outputs.version) || '' }}

  release-cli:
    name: Release CLI Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod

      - name: Build CLI
        working-directory: apps/cli
        shell: bash
        env:
          GOWORK: "off"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w -X github.com/hydradns/hydra-cli/cmd.Version=${GITHUB_REF_NAME#v}" -o hydra-${{ matrix.goos }}-${{ matrix.goarch }} .

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: apps/cli/hydra-${{ matrix.goos }}-${{ matrix.goarch }}

  release-cli-checksums:
    name: Publish CLI checksums
    needs: release-cli
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Re-runs of this job land here again for the same tag: --clobber on
      # both download and upload makes every step below safe to repeat.
      - name: Download CLI binaries from the release
        run: |
          rm -rf assets && mkdir -p assets
          gh release download "${{ github.ref_name }}" --dir assets --pattern "hydra-*" --clobber

      - name: Generate checksums.txt
        working-directory: assets
        run: |
          sha256sum hydra-* > checksums.txt
          cat checksums.txt

      - name: Upload checksums.txt to the release
        working-directory: assets
        run: gh release upload "${{ github.ref_name }}" checksums.txt --clobber
