name: Publish to MCP Registry

# Manual: run from the Actions tab after a release's hydra-cli image is public on GHCR.
# Authenticates with GitHub OIDC, which proves to the registry that this workflow runs in
# the hydradns organisation, so no token or secret is needed.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-mcp
  cancel-in-progress: false

jobs:
  publish:
    name: Publish apps/cli/server.json
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Check the image in server.json is publicly pullable
        run: |
          image=$(jq -r '.packages[0].identifier' server.json)
          repo=${image#ghcr.io/}; repo=${repo%%:*}; tag=${image##*:}
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r .token)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' "https://ghcr.io/v2/${repo}/manifests/${tag}")
          if [ "$code" != "200" ]; then
            echo "::error::${image} is not publicly pullable (HTTP ${code}). Make the GHCR package public first."
            exit 1
          fi

      - name: Validate
        run: ./mcp-publisher validate

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
